<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- rotated variant: arms on the diagonals, negative space forms a plus -->
  <g fill="#ff9d2e" transform="rotate(45 256 256)">
    <polygon id="arm" points="227,48 285,48 285,136 352,136 256,232 160,136 227,136"/>
    <use href="#arm" transform="rotate(90 256 256)"/>
